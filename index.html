<style>
  :root{
    /* Original deep burgundy color, slightly transparent */
    --sheet-color: rgba(58, 8, 8, 0.90); 
    
    --text-main: #f4e8d9;
    --text-muted: #c8b2a5;
    --gold: #d4a94f;
  }
  *{box-sizing:border-box;}
  
  html, body{ 
    margin:0; padding:0; min-height:100vh; 
    font-family:'Cormorant Garamond', serif;
  }
  
  body{
    background-image: url('bg.jpg'); 
    background-color: #e3d5c5;
    background-size: cover; 
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    
    display: flex;
    justify-content: center;
    align-items: center;
    
    padding: 30px;
    padding-top: calc(30px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  }

  /* 🎯 SUPER ROUNDED CORNERS (Capsule / Bubble style) */
  .poem-sheet {
    background-color: var(--sheet-color);
    
    /* Very subtle blur so the background texture softly blends */
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    
    border: 1px solid rgba(212, 169, 79, 0.2);
    width: 100%;
    max-width: 800px;
    min-height: 85vh;
    max-height: 95vh; 
    overflow-y: auto; 
    
    padding: 50px 60px;
    
    /* THE FIX: Massive border-radius for that smooth circular look */
    border-radius: 48px; 
    
    box-shadow: 
      0 25px 60px rgba(0,0,0,0.7), 
      inset 0 0 120px rgba(0,0,0,0.6); 
      
    display: flex;
    flex-direction: column;
    position: relative;
    color: var(--text-main);
  }

  /* Custom Scrollbar */
  .poem-sheet::-webkit-scrollbar { width: 8px; }
  .poem-sheet::-webkit-scrollbar-track { background: transparent; }
  .poem-sheet::-webkit-scrollbar-thumb { background: rgba(212, 169, 79, 0.3); border-radius: 10px; }

  /* Subtle texture overlay */
  .poem-sheet::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, transparent 2px, transparent 4px);
    pointer-events: none;
    border-radius: 48px; /* Matches parent */
  }

  .brand {
    text-align: center;
    font-style: italic;
    font-size: 1.8rem;
    color: var(--gold);
    margin-bottom: 30px;
    letter-spacing: 1px;
    opacity: 0.9;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(212, 169, 79, 0.2);
    z-index: 2;
  }

  select {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'Special Elite', serif;
    font-size: 1rem;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  select option { background: #2a0505; color: var(--text-main); }

  .lang-switch {
    display: flex;
    gap: 15px;
    font-family: 'Special Elite', serif;
    font-size: 0.95rem;
    letter-spacing: 1px;
  }
  .lang-switch span {
    color: rgba(244, 232, 217, 0.3);
    cursor: pointer;
    transition: color 0.3s;
  }
  .lang-switch span.active {
    color: var(--gold);
    border-bottom: 1px solid var(--gold);
  }

  /* Poem Area */
  .poem-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 20px 0;
    z-index: 2;
    font-size: 1.4rem;
    line-height: 2;
    white-space: pre-line;
    animation: fadeIn 0.6s ease;
    
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .poem-title {
    color: var(--gold);
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-family: 'Special Elite', serif;
    margin-bottom: 25px;
    display: block;
  }

  .poem-area .byline {
    margin-top: 35px;
    font-style: italic;
    color: var(--gold);
    font-size: 1.2rem;
    opacity: 0.8;
  }

  /* Action Area */
  .action-area {
    text-align: center;
    margin-top: 20px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* Pill shaped button */
  .gen-btn {
    background: transparent;
    border: 1px solid rgba(212, 169, 79, 0.4);
    color: var(--gold);
    padding: 14px 40px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.3rem;
    border-radius: 50px; /* Pill shape */
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    width: 100%;
    max-width: 300px;
  }

  .gen-btn:hover {
    background: rgba(212, 169, 79, 0.1);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  
  .gen-btn:active { transform: translateY(0); }

  .famous-link {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    cursor: pointer;
    transition: color 0.3s;
    opacity: 0.7;
    text-decoration: underline;
    text-decoration-color: transparent;
  }

  .famous-link:hover {
    color: var(--gold);
    opacity: 1;
    text-decoration-color: var(--gold);
  }

  .copy-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'Special Elite', serif;
    font-size: 0.8rem;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    margin-top: 10px;
    display: none;
  }
  .copy-btn:hover { opacity: 1; color: var(--gold); }

  /* 📱 Mobile Adjustments */
  @media (max-width: 768px) {
    body { padding: 15px; }
    .poem-sheet { 
      max-width: 100%; 
      min-height: 85vh; 
      padding: 30px 20px; 
      /* Still very round on mobile, but fits the screen better */
      border-radius: 32px; 
      background-color: rgba(58, 8, 8, 0.93);
    }
    .poem-sheet::before { border-radius: 32px; }
    .poem-area { font-size: 1.15rem; line-height: 1.8; }
    .brand { font-size: 1.4rem; margin-bottom: 20px; }
    .gen-btn { font-size: 1.1rem; padding: 12px 25px; }
  }
</style>

const pick = a => a[Math.floor(Math.random() * a.length)];
function makePicker(list){
  let pool = [];
  return () => { if (!pool.length) pool = [...list].sort(() => Math.random() - 0.5); return pool.pop(); };
}

function generateLocalPoem(topicKey, lang){
  const DATA = lang === "hi" ? DATA_HI : DATA_EN;
  const TEMPLATES = lang === "hi" ? TEMPLATES_HI : TEMPLATES_EN;
  const t = DATA[topicKey];
  const bank = { noun: makePicker(t.nouns), adj: makePicker(t.adjs), gerund: makePicker(t.gerunds), place: makePicker(t.places) };
  const fill = tpl => tpl.replace(/\{(\w+)\}/g, (_, k) => bank[k] ? bank[k]() : _);
  
  const stanzas = [];
  for (let s = 0; s < 3; s++){
    const lines = [];
    const count = 2 + (Math.random() < 0.5 ? 0 : 1);
    for (let l = 0; l < count; l++){ lines.push(fill(pick(TEMPLATES))); }
    stanzas.push(lines.join("\n"));
  }
  return stanzas.join("\n\n") + "\n\n" + fill(pick(t.closers));
}

/* UI Logic */
let currentLang = "hi";
const $langSwitch = document.getElementById("langSwitch");
const $poemArea = document.getElementById("poemArea");
const $genBtn = document.getElementById("genBtn");
const $famousBtn = document.getElementById("famousBtn");
const $copyBtn = document.getElementById("copyBtn");
const $genre = document.getElementById("genre");

$langSwitch.addEventListener("click", function(e){
  if(e.target.tagName !== "SPAN") return;
  $langSwitch.querySelectorAll("span").forEach(s => s.classList.remove("active"));
  e.target.classList.add("active");
  currentLang = e.target.dataset.lang;
});

function displayResult(htmlContent, textToCopy) {
  $poemArea.style.opacity = 0;
  $copyBtn.style.display = "none";
  
  setTimeout(() => {
    $poemArea.innerHTML = htmlContent;
    $poemArea.style.transition = "opacity 0.6s ease";
    $poemArea.style.opacity = 1;
    $copyBtn.style.display = "inline-block";
    
    $copyBtn.onclick = async function(){
      try {
        await navigator.clipboard.writeText(textToCopy);
        this.textContent = "copied!";
        setTimeout(() => this.textContent = "copy to clipboard", 2000);
      } catch (err) { this.textContent = "error"; }
    };
  }, 300); 
}

// Generate My Poem (Local)
$genBtn.addEventListener("click", function(){
  const topic = $genre.value;
  const poemText = generateLocalPoem(topic, currentLang);
  
  const html = `
    ${poemText}
    <div class="byline">&mdash; Mysha</div>
  `;
  displayResult(html, poemText + "\n\n— Mysha");
});

// Generate Famous Poem
$famousBtn.addEventListener("click", function(){
  const topic = $genre.value;
  const poem = pick(FAMOUS[topic]);
  
  const html = `
    <span class="poem-title">${poem.title}</span>
    ${poem.lines}
    <div class="byline">&mdash; ${poem.author}</div>
  `;
  displayResult(html, `${poem.title}\nby ${poem.author}\n\n${poem.lines}`);
});

// Generate automatically on load
window.addEventListener('DOMContentLoaded', () => { $genBtn.click(); });
</script>
